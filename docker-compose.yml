version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg15
    container_name: capitaledge_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: capitaledge
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: capitaledge_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - SQLALCHEMY_DATABASE_URI=postgresql+psycopg2://postgres:admin@db:5432/capitaledge
      - DEBUG=False
      - FASTAPI_CONFIG=development
      # - OPENAI_API_KEY=${OPENAI_API_KEY}
      # - AUTH_TOKEN=${AUTH_TOKEN}
    depends_on:
      db:
        condition: service_healthy
    command: >
      bash -c "uvicorn server.main:app --host 0.0.0.0 --port 8000"

volumes:
  postgres_data:
