name: Deploy to Production

on:
  push:
    branches:
    - main
  workflow_dispatch:


jobs:
  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest
    environment: production

    # We depend on successful CI runs before allowing deployment.
    # Note: If these workflows are separated, consider using workflow_run triggers 
    # instead of inline jobs, or ensure CI runs before this via branch protection.

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup SSH Context (Placeholder)
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

    - name: Validate Environment Variables
      run: |
        if [ -z "${{ secrets.DATABASE_URL }}" ]; then
          echo "DATABASE_URL is missing"
          exit 1
        fi
        if [ -z "${{ secrets.JWT_SECRET }}" ]; then
          echo "JWT_SECRET is missing"
          exit 1
        fi

    - name: Deploy to Server (Placeholder)
